# Reference image (role "ref"): the base image without role-specific content.
# Build with `make ref` / `make ref-test`. The Makefile adds the kernel
# package (flavor "server", version from kernel/VERSION), ImageVersion
# (ref/VERSION), the signing keys and the staged binaries and public keys.

# ImageId must be set before the base is included (UKI file name).
[Output]
ImageId=enclave-ref

[Include]
Include=../mkosi
