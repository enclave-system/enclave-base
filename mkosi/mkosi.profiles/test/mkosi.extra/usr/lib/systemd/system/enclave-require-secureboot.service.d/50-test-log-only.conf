# Test profile: report a Secure Boot violation but keep running, so the
# selftest can still report and the later steps run: with Secure Boot off it
# is then the TPM policy (exact PCR 7) that refuses the volume key, which is
# what the VM proofs show. Resets the production condition and action; the
# "-" makes the units that require this one start anyway.
[Unit]
ConditionPathExists=
FailureAction=none

[Service]
ExecStart=
ExecStart=-/usr/lib/enclave/require-secureboot --log-only
