# enclave base image. Component repos set ImageId= FIRST (it is used by
# UnifiedKernelImageFormat below) and then include this directory:
#   [Output]
#   ImageId=enclave-<role>
#   [Include]
#   Include=<path-to-enclave-base>/mkosi
# Besides that they set only Packages= (incl. the kernel flavor package),
# their own extra trees and /usr/lib/enclave/role.
#
# Signing keys are passed on the mkosi command line by the Makefile, because
# mkosi 27.1 does not expand $ENCLAVE_PKI_DIR in key/certificate settings:
#   --secure-boot-key=$ENCLAVE_PKI_DIR/sb/db.key
#   --secure-boot-certificate=$ENCLAVE_PKI_DIR/sb/db.crt
#   --verity-key=$ENCLAVE_PKI_DIR/verity/verity.key
#   --verity-certificate=$ENCLAVE_PKI_DIR/verity/verity.crt
#   --sign-expected-pcr-key=$ENCLAVE_PKI_DIR/pcr/pcr-signing.key
#   --sign-expected-pcr-certificate=<pcr-signing.pub + X.509 wrapper> (make pcr-cert)
#
# Layout: no root partition. / is a tmpfs, /usr comes from a signed dm-verity
# partition (A/B slots for systemd-sysupdate), /etc is populated from
# /usr/share/factory/etc at boot, /var is a TPM2-bound LUKS2 partition that
# systemd-repart creates on the target disk at first boot.

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64

[Build]
# tools/ukify: adds --phases=enter-initrd:leave-initrd to the PCR signing.
ExtraSearchPaths=tools

[Output]
Format=disk
SplitArtifacts=uki,partitions,roothash

[Content]
Bootable=yes
Bootloader=systemd-boot
# "yes" means "signed" in mkosi 27.1, i.e. a prebuilt distro UKI. "unsigned"
# builds the UKI locally; it is still signed with SecureBootKey below.
UnifiedKernelImages=unsigned
UnifiedKernelImageFormat=%i_%v
# Fixed command line (Global Constraints) plus additions:
#  systemd.import_credentials=no: never import credentials from the ESP
#    (systemd-stub), SMBIOS or fw_cfg; those sources are unauthenticated.
#  root=tmpfs: amnesic root, /usr is
# mounted from the verity device (usrhash= is added by mkosi).
KernelCommandLine=
        lockdown=confidentiality
        module.sig_enforce=1
        apparmor=1
        security=apparmor
        init_on_alloc=1
        init_on_free=1
        page_alloc.shuffle=1
        slab_nomerge
        pti=on
        vsyscall=none
        debugfs=off
        oops=panic
        iommu=force
        intel_iommu=on
        amd_iommu=force_isolation
        ipv6.disable=1
        systemd.import_credentials=no
        root=tmpfs
Packages=
        systemd
        systemd-sysv
        systemd-boot
        systemd-boot-efi
        systemd-cryptsetup
        systemd-repart
        udev
        tpm2-tools
        libtss2-tcti-device0t64
        cryptsetup-bin
        e2fsprogs
        kmod
        apparmor
        nftables
        iproute2
        ca-certificates
WithDocs=no
CleanPackageMetadata=yes
RemoveFiles=
        /usr/share/doc
        /usr/share/man
        /usr/share/info
        /usr/share/locale
        /usr/share/lintian
        /usr/share/bug

[Validation]
SecureBoot=yes
# Keys are enrolled by the owner (firmware / enclave-pki ovmf-vars), never by
# systemd-boot from the ESP.
SecureBootAutoEnroll=no
# SecureBootKey/-Certificate: db.key/db.crt (command line, see above)
Verity=signed
# VerityKey/-Certificate: verity.key/verity.crt (command line, see above)
# Signed PCR 11 policy (systemd-measure via ukify); the public key is embedded
# in the UKI (.pcrpkey) and used by systemd-repart to bind /var.
SignExpectedPcr=yes
# SignExpectedPcrKey/-Certificate: pcr-signing.key + wrapper (command line)
