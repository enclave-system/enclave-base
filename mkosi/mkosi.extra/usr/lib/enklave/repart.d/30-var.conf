# Runtime definition (NOT used at image build time): systemd-repart creates
# /var on the target disk at first boot, see enklave-var-repart.service.
# The TPM2 binding (PCR 7 + signed PCR 11 policy) is passed on the
# systemd-repart command line; repart.d has no per-partition TPM settings.
[Partition]
Type=var
Label=enklave-var
Format=ext4
Encrypt=tpm2
FactoryReset=yes
SizeMinBytes=1G
