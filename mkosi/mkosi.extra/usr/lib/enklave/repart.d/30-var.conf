# Runtime definition (NOT used at image build time): systemd-repart creates an
# empty state partition on the disk that carries /usr at first boot
# (enklave-var-repart.service). enklave-varauth formats it as LUKS2
# (aes-xts-plain64 + hmac-sha256 integrity, argon2id) with a key held in a
# TPM NV index; systemd-repart 257 cannot create integrity-protected volumes.
# Fixed 1 GiB: only enklave state is persistent (everything else in /var is
# volatile), and the integrity wipe at first boot stays short.
[Partition]
Type=var
Label=enklave-var
FactoryReset=no
SizeMinBytes=1G
SizeMaxBytes=1G
