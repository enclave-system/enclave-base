# Runtime definition (NOT used at image build time): systemd-repart creates an
# empty /var partition on the disk that carries /usr at first boot
# (enklave-var-repart.service). enklave-varauth then formats it as LUKS2
# (aes-xts-plain64 + hmac-sha256 integrity, argon2id) with a key held in a
# TPM NV index; systemd-repart 257 cannot create integrity-protected volumes.
[Partition]
Type=var
Label=enklave-var
FactoryReset=no
SizeMinBytes=1G
