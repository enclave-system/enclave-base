#!/usr/sbin/nft -f
# enklave base firewall: default drop in every direction. Loaded by
# nftables.service (drop-in) from the verity-protected /usr;
# /etc/nftables.conf is a symlink to this file.
#
# The family is "ip": the enklave kernels are built without IPv6
# (kernel/rules/common.rules: !CONFIG_IPV6), and "inet" tables need
# CONFIG_NF_TABLES_INET, which depends on IPV6.

flush ruleset

table ip enklave {
	chain input {
		type filter hook input priority filter; policy drop;
		iif "lo" accept
		ct state established,related accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy drop;
		oif "lo" accept
	}
}

# Role repos and profiles add rules here, e.g.
#   table ip enklave { chain output { ip daddr 192.0.2.1 udp dport 51820 accept } }
include "/usr/lib/enklave/nft.d/*.nft"
